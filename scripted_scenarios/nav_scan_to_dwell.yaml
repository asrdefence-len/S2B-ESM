scenario:
  name: nav_scan_to_dwell
  description: E3 establishes a 30 RPM periodic scan, dwells on the ESM bearing, then resumes scanning
  duration_s: 35.0

emitters:
  - id: E3
    type: X_BAND_NAV_RADAR
    aoa_deg: 135.0
    peak_level_dbfs: -6.0

    timeline:
      - time_s: 0.0
        mode: NAV_SCAN

      - time_s: 15.0
        mode: DWELL

      - time_s: 25.0
        mode: NAV_SCAN
