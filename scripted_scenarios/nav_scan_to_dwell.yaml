scenario:
  name: nav_scan_to_dwell
  description: E3 alternates between rotating NAV scan and fixed dwell every 10 seconds
  duration_s: 120.0

esm_receiver:
  antenna_gain_dbi: 10.0
  noise_floor_dbm: -86.0
  detection_threshold_dbm: -76.0

emitters:
  - id: E3
    type: X_BAND_NAV_RADAR
    aoa_deg: 135.0
    range_km: 15.0

    # Physical initial condition. This determines when the rotating beam happens
    # to cross the ESM bearing; the scenario does not script illumination times.
    initial_antenna_azimuth_deg: 20.0

    # Keep all mode changes aligned to integer 10-second boundaries. This makes
    # the one-second PDW histogram and mode ticker easier to interpret because a
    # transition is not deliberately split across neighbouring second bins.
    timeline:
      - time_s: 0.0
        mode: NAV_SCAN

      - time_s: 10.0
        mode: DWELL

      - time_s: 20.0
        mode: NAV_SCAN

      - time_s: 30.0
        mode: DWELL

      - time_s: 40.0
        mode: NAV_SCAN

      - time_s: 50.0
        mode: DWELL

      - time_s: 60.0
        mode: NAV_SCAN

      - time_s: 70.0
        mode: DWELL

      - time_s: 80.0
        mode: NAV_SCAN

      - time_s: 90.0
        mode: DWELL

      - time_s: 100.0
        mode: NAV_SCAN

      - time_s: 110.0
        mode: DWELL

      - time_s: 120.0
        mode: NAV_SCAN
