scenario:
  name: nav_scan_to_dwell
  description: E3 rotates continuously, later changes to a fixed dwell, then resumes rotation
  duration_s: 35.0

esm_receiver:
  antenna_gain_dbi: 10.0
  noise_floor_dbm: -86.0
  detection_threshold_dbm: -76.0

emitters:
  - id: E3
    type: X_BAND_NAV_RADAR
    aoa_deg: 135.0
    range_km: 15.0

    # Physical initial condition. This determines when the rotating beam happens
    # to cross the ESM bearing; the scenario does not script illumination times.
    initial_antenna_azimuth_deg: 20.0

    timeline:
      - time_s: 0.0
        mode: NAV_SCAN

      - time_s: 15.0
        mode: DWELL

      - time_s: 25.0
        mode: NAV_SCAN
