scenario:
  name: nav_scan_to_dwell
  description: E3 alternates between 10-second rotating NAV scans and 4-second fixed dwells
  duration_s: 126.0

esm_receiver:
  antenna_gain_dbi: 10.0
  noise_floor_dbm: -86.0
  detection_threshold_dbm: -76.0

emitters:
  - id: E3
    type: X_BAND_NAV_RADAR
    aoa_deg: 135.0
    range_km: 15.0

    # Physical initial condition. This determines when the rotating beam happens
    # to cross the ESM bearing; the scenario does not script illumination times.
    initial_antenna_azimuth_deg: 20.0

    # Each behaviour cycle is 14 seconds: 10 seconds scanning, then 4 seconds
    # dwelling. All transitions remain on whole-second boundaries so the PDW/sec
    # histogram and mode ticker remain easy to interpret.
    timeline:
      - time_s: 0.0
        mode: NAV_SCAN

      - time_s: 10.0
        mode: DWELL

      - time_s: 14.0
        mode: NAV_SCAN

      - time_s: 24.0
        mode: DWELL

      - time_s: 28.0
        mode: NAV_SCAN

      - time_s: 38.0
        mode: DWELL

      - time_s: 42.0
        mode: NAV_SCAN

      - time_s: 52.0
        mode: DWELL

      - time_s: 56.0
        mode: NAV_SCAN

      - time_s: 66.0
        mode: DWELL

      - time_s: 70.0
        mode: NAV_SCAN

      - time_s: 80.0
        mode: DWELL

      - time_s: 84.0
        mode: NAV_SCAN

      - time_s: 94.0
        mode: DWELL

      - time_s: 98.0
        mode: NAV_SCAN

      - time_s: 108.0
        mode: DWELL

      - time_s: 112.0
        mode: NAV_SCAN

      - time_s: 122.0
        mode: DWELL

      - time_s: 126.0
        mode: NAV_SCAN
